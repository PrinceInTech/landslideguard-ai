name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the event-aware whitespace check below can diff the
          # PR base / previous push tip, and so `git hash-object` sees the tree.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run backend test suite
        run: python -m pytest -q

      - name: Whitespace / conflict-marker check
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          is_commit() { git cat-file -e "${1}^{commit}" 2>/dev/null; }

          head="${GITHUB_SHA:-}"
          base=""
          diff_spec=""

          case "$EVENT_NAME" in
            pull_request)
              # Changes introduced by the PR, relative to its merge base.
              base="$PR_BASE"
              diff_spec="${base}...${head}"
              ;;
            push)
              # The pushed range. A zeroed "before" means a brand-new branch:
              # fall back to the commit's parent.
              base="$PUSH_BEFORE"
              if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! is_commit "$base"; then
                base="${head}^"
              fi
              diff_spec="${base}..${head}"
              ;;
            *)
              echo "::error::whitespace check: unsupported event '$EVENT_NAME'"
              exit 1
              ;;
          esac

          if [ -z "$head" ] || ! is_commit "$head"; then
            echo "::error::whitespace check: head commit '$head' not present in the checkout"
            exit 1
          fi
          if [ -z "$base" ] || ! is_commit "$base"; then
            echo "::error::whitespace check: could not determine a base for '$head' (base='$base')"
            exit 1
          fi

          echo "git diff --check $diff_spec"
          git diff --check "$diff_spec"

      - name: Verify protected files are unmodified
        working-directory: .
        run: bash .github/scripts/check-protected-files.sh

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Build
        run: npm run build
