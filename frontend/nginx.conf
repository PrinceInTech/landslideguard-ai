# LandslideGuard AI - nginx
#
# Serves the built SPA and reverse-proxies the API so the browser only ever
# talks to one origin (avoids CORS entirely in the Docker demo).
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # nginx defaults to 1m, which silently rejects the dataset upload endpoint
  # (413) even though the backend accepts much larger files. Keep this at or
  # above the backend MAX_UPLOAD_MB limit.
  client_max_body_size 50m;

  # Baseline hardening. The app ships no inline scripts and no third-party
  # origins, so the policy can stay strict without breaking the SPA.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  # Do not advertise the nginx version.
  server_tokens off;

  # Hashed build assets are immutable.
  # NOTE: add_header inside a location block discards all inherited server-level
  # add_header directives, which would drop the security headers above. Cache
  # directives are therefore expressed with `expires` so the inherited security
  # headers survive.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # API reverse proxy -> FastAPI container.
  location /api {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    # Model retraining can take a while.
    proxy_connect_timeout 15s;
    # Uploads are streamed to the backend; do not buffer large bodies in nginx.
    proxy_request_buffering off;
  }

  # Never cache index.html so deploys are picked up immediately.
  location = /index.html {
    expires -1;
  }

  # Client-side routing: unknown paths fall back to the SPA entry point so
  # deep links like /dashboard or /alerts work on a hard refresh.
  location / {
    try_files $uri $uri/ /index.html;
  }
}