# LandslideGuard AI - nginx
#
# Serves the built SPA and reverse-proxies the API so the browser only ever
# talks to one origin (avoids CORS entirely in the Docker demo).
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Hashed build assets are immutable.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # API reverse proxy -> FastAPI container.
  location /api {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    # Model retraining can take a while.
    proxy_connect_timeout 15s;
  }

  # Never cache index.html so deploys are picked up immediately.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  # Client-side routing: unknown paths fall back to the SPA entry point so
  # deep links like /dashboard or /alerts work on a hard refresh.
  location / {
    try_files $uri $uri/ /index.html;
  }
}