      name="description"

    <!--
      No external stylesheets or web fonts: nginx serves a strict CSP
      (style-src/font-src 'self'), which blocks fonts.googleapis.com and
      unpkg. Leaflet CSS is bundled through src/main.jsx and Inter is
      replaced by the system font stack in tailwind.config.js, so the app
      is fully self-contained in dev, Docker and any other origin.
    -->
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
